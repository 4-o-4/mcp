spring:
  main:
    web-application-type: none
  ai:
    openai:
      base-url: https://openrouter.ai/api
      api-key: ${OPENROUTER_API_KEY}
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:openrouter/free}
      embedding:
        options:
          model: ${OPENROUTER_EMBEDDING_MODEL:nvidia/llama-nemotron-embed-vl-1b-v2:free}

router:
  http-referer: ${OPENROUTER_HTTP_REFERER:https://localhost}
  site-title: ${OPENROUTER_SITE_TITLE:mcp-host}

